name: records-demo
services:
  app:
    build: .
    privileged: true
    volumes:
      - records-data:/var/lib/records
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "18081:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"]
      interval: 2s
      timeout: 3s
      retries: 15
  proxy:
    image: nginx:1.28.0-alpine@sha256:30f1c0d78e0ad60901648be663a710bdadf19e4c10ac6782c235200619158284
    ports:
      - "127.0.0.1:${PORT:-18080}:8080"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/users.htpasswd:/etc/nginx/users.htpasswd:ro
      - ./ops:/srv/ops:ro
    depends_on:
      app:
        condition: service_healthy
volumes:
  records-data:
