server {
    listen 8080;
    server_name _;
    client_max_body_size 16k;

    location = /health {
        proxy_pass http://app:8000;
    }

    location /api/ {
        auth_basic "Records";
        auth_basic_user_file /etc/nginx/users.htpasswd;
        proxy_pass http://app:8000;
    }

    location /exports/ {
        alias /srv/ops/;
        autoindex on;
    }

    location / {
        proxy_pass http://app:8000;
    }
}
